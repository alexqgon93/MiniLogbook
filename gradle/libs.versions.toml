[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.3.0"
composeBom = "2026.02.01"
androidxHilt = "1.3.0"
junitPlatformLauncher = "6.0.0"
androidx-viewmodel = "2.9.4"
mockk = "1.14.5"
